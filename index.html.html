<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaggio nella cellula</title>
<style>
:root{--bg:#f3f7f1;--sf:#fff;--t:#1d2a22;--m:#5b6b61;--b:#cfdcd0;--ac:#1d8a5a;--ac2:#e0f2e8;--bad:#c0392b;--ok:#1d8a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a15;--sf:#1a261f;--t:#e6f0e8;--m:#9db0a4;--b:#2f4236;--ac:#4cc58b;--ac2:#1f3a2c;--bad:#ff7a6b;--ok:#4cc58b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a15;--sf:#1a261f;--t:#e6f0e8;--m:#9db0a4;--b:#2f4236;--ac:#4cc58b;--ac2:#1f3a2c;--bad:#ff7a6b;--ok:#4cc58b;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,button,nav,.tag{font-family:"Trebuchet MS",Verdana,sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--b);display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
nav a{white-space:nowrap;padding:7px 12px;border-radius:99px;color:var(--t);text-decoration:none;font-size:14px;border:1px solid var(--b)}
nav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:2rem;line-height:1.15;margin:.2em 0}h2{margin:1.2em 0 .4em;font-size:1.25rem}
.card{background:var(--sf);border:1px solid var(--b);border-radius:14px;padding:14px 16px;margin:12px 0}
.art{background:var(--sf);border:1px solid var(--b);border-radius:14px;padding:8px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--t);font:600 11px "Trebuchet MS",sans-serif}
button{font-size:15px;padding:9px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--sf);color:var(--t);cursor:pointer}
button:hover{background:var(--ac2)}button.p{background:var(--ac);color:#fff}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
ul{padding-left:20px}li{margin:.35em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid a{display:block;text-decoration:none;color:var(--t)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac2);font-size:13px}
.table{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--b);padding:7px 9px;text-align:left}
.opt{display:block;width:100%;text-align:left;margin:7px 0}
.opt.r{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.w{background:var(--bad);color:#fff;border-color:var(--bad)}
.fc{perspective:900px;height:220px;margin:12px 0;cursor:pointer}
.fc>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.f>div{transform:rotateY(180deg)}
.fc p{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:var(--sf);border:2px solid var(--ac);border-radius:16px;backface-visibility:hidden}
.fc p+p{transform:rotateY(180deg);background:var(--ac2)}
.bar{height:10px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.big{font-size:2.4rem;font-weight:700;font-family:"Trebuchet MS",sans-serif}
.hot{cursor:pointer}.hot:hover{filter:brightness(1.15);stroke:var(--t);stroke-width:2}
@media(prefers-reduced-motion:reduce){.fc>div{transition:none}}
</style></head><body>

<script>
var L=function(x,y,t,a){return '<text x="'+x+'" y="'+y+'" text-anchor="'+(a||"start")+'">'+t+'</text>'};
var S=function(b){return '<svg viewBox="0 0 300 200" role="img">'+b+'</svg>'};
var O=[
{id:"nucleo",n:"Nucleo e nucleolo",e:"🧠",
svg:S('<circle cx="140" cy="100" r="82" fill="#7F77DD33" stroke="#7F77DD" stroke-width="6"/><circle cx="140" cy="100" r="72" fill="none" stroke="#534AB7" stroke-width="2"/>'+[0,40,80,120,160,200,240,280,320].map(function(a){var r=a*Math.PI/180;return '<circle cx="'+(140+77*Math.cos(r))+'" cy="'+(100+77*Math.sin(r))+'" r="4" fill="var(--bg)" stroke="#534AB7" stroke-width="2"/>'}).join("")+'<path d="M80 80q20-25 35 0t-25 30 35 22" fill="none" stroke="#D4537E" stroke-width="3"/><path d="M175 60q25 10 10 35" fill="none" stroke="#D4537E" stroke-width="3"/><circle cx="150" cy="108" r="24" fill="#534AB7"/><circle cx="150" cy="108" r="9" fill="#AFA9EC"/>'+L(240,50,"Involucro")+L(240,64,"nucleare")+L(240,125,"Nucleolo")+L(232,95,"Cromatina")+L(240,182,"Poro nucleare")+'<path d="M238 175l-60-30M238 120l-62-6M230 90l-20-5M238 55l-48 4" stroke="var(--m)" fill="none"/>'),
come:["Involucro nucleare: doppia membrana con pori nucleari che regolano lo scambio di molecole (per esempio l’RNA messaggero) con il citoplasma. Sotto la membrana interna c’è la lamina nucleare, una rete di proteine che dà sostegno.","Nucleoplasma: la sostanza interna in cui sono immersi cromatina e nucleolo.","Cromatina: DNA associato a proteine; durante la divisione si condensa nei cromosomi.","Nucleolo: regione densa, senza membrana (quindi non è un vero organulo). Ha tre zone: centro fibrillare (si trascrive l’rRNA), componente fibrillare densa (l’rRNA viene elaborato), componente granulare (si assemblano le subunità dei ribosomi)."],
f:["Contiene il DNA ed è il centro di controllo: stabilisce quali proteine produrre e coordina crescita e divisione cellulare.","Il nucleolo produce l’rRNA e assembla le subunità dei ribosomi, che poi escono dal nucleo.","Il nucleolo partecipa anche alla risposta della cellula agli stress."],
u:["Il nucleo è l’organulo più grande della cellula eucariote.","Il nucleolo cambia dimensione: è grande nelle cellule che producono molte proteine, scompare durante la mitosi e ricompare alla fine.","Nelle cellule umane ci sono 10 organizzatori nucleolari, sui cromosomi 13, 14, 15, 21 e 22.","Nel 1964 Gurdon e Brown studiarono la rana Xenopus laevis: gli embrioni senza nucleolo non si sviluppavano. Nel 1966 Birnstiel dimostrò che il DNA del nucleolo contiene le istruzioni per l’rRNA."]},
{id:"dna",n:"DNA e cromosomi",e:"🧬",
svg:S('<path d="M30 40Q80 10 130 40T230 40" fill="none" stroke="#D4537E" stroke-width="5"/><path d="M30 40Q80 70 130 40T230 40" fill="none" stroke="#378ADD" stroke-width="5"/>'+[50,80,110,150,180,210].map(function(x){return '<line x1="'+x+'" y1="'+(x%60<30?27:53)+'" x2="'+x+'" y2="'+(x%60<30?53:27)+'" stroke="var(--m)" stroke-width="2"/>'}).join("")+L(240,30,"Doppia elica")+'<g>'+[0,1,2,3].map(function(i){return '<circle cx="'+(40+i*34)+'" cy="115" r="14" fill="#EF9F27" stroke="#BA7517" stroke-width="2"/>'}).join("")+'</g><path d="M26 115H190" stroke="#D4537E" stroke-width="2" fill="none" opacity=".6"/>'+L(40,150,"Nucleosoma = DNA avvolto sugli istoni")+'<path d="M215 90l30 50-30 50M245 90l-30 50 30 50" fill="none" stroke="#7F77DD" stroke-width="12" stroke-linecap="round"/><circle cx="230" cy="140" r="7" fill="#534AB7"/>'+L(235,198,"Cromosoma","middle")),
come:["Doppia elica di DNA (acido desossiribonucleico) associata a proteine chiamate istoni.","Cromatina: DNA + istoni nel nucleo. Quando la cellula si divide si condensa e forma i cromosomi visibili.","Nucleosoma: unità base della cromatina. Circa 146 paia di basi di DNA si avvolgono attorno a un ottamero di istoni (due copie ciascuna di H2A, H2B, H3, H4).","Istone H1: proteina «linker» che stabilizza il tratto di DNA tra un nucleosoma e il successivo.","Eucarioti: più cromosomi lineari nel nucleo. Procarioti: in genere un unico cromosoma circolare, senza nucleo."],
f:["Contiene le istruzioni per costruire e far funzionare ogni essere vivente.","Cariotipo: l’insieme dei cromosomi di una cellula, ordinati per forma e dimensione. Permette di individuare alterazioni nel numero o nella forma dei cromosomi.","La specie umana ha 46 cromosomi (23 coppie): 22 coppie di autosomi e una coppia di cromosomi sessuali (XX femmine, XY maschi)."],
u:["Scoperta: nel 1869 Friedrich Miescher isolò il DNA e lo chiamò «nucleina».","Nel 1953 Watson e Crick proposero la doppia elica. Fu determinante la «Foto 51» di Rosalind Franklin con Raymond Gosling, insieme ai dati di Maurice Wilkins.","Il DNA di una sola cellula umana, srotolato, misurerebbe circa 2 metri.","Due esseri umani condividono circa il 99,9% del DNA; con gli scimpanzé circa il 98-99%.","Con la banana circa il 60% dei nostri geni ha un gene corrispondente (omologo): non è il 60% del DNA complessivo.","In laboratorio si sono immagazzinati dati nel DNA con densità teorica di circa 215 milioni di gigabyte per grammo."]},
{id:"ribosomi",n:"Ribosomi",e:"⚙️",
svg:S('<path d="M10 150Q60 120 110 150T210 150T290 140" fill="none" stroke="#1D9E75" stroke-width="4" stroke-dasharray="10 4"/><ellipse cx="150" cy="105" rx="52" ry="34" fill="#378ADD" opacity=".85"/><ellipse cx="150" cy="70" rx="34" ry="22" fill="#85B7EB"/>'+L(150,112,"Subunità grande","middle")+L(150,74,"piccola","middle")+L(30,172,"mRNA (il progetto)")+'<circle cx="200" cy="30" r="9" fill="#EF9F27"/><circle cx="220" cy="38" r="9" fill="#EF9F27"/><circle cx="240" cy="30" r="9" fill="#EF9F27"/><circle cx="260" cy="38" r="9" fill="#EF9F27"/>'+L(230,62,"catena di amminoacidi","middle")+'<path d="M182 62q10-20 18-30" stroke="var(--m)" fill="none"/>'+L(150,196,"Procarioti 70S = 50S + 30S · Eucarioti 80S = 60S + 40S","middle")),
come:["Non hanno membrana. Sono formati da rRNA e proteine, in due subunità.","Subunità piccola: legge l’mRNA. Subunità grande: unisce gli amminoacidi tra loro. Si uniscono solo quando il ribosoma deve lavorare.","Procarioti: ribosoma 70S (50S + 30S). Eucarioti: 80S (60S + 40S). La S è l’unità Svedberg, che misura la velocità di sedimentazione in centrifuga: per questo 50 + 30 ≠ 70.","Dove si trovano: liberi nel citoplasma, sul reticolo endoplasmatico rugoso, dentro mitocondri e cloroplasti (ribosomi propri, simili a quelli dei batteri)."],
f:["Costruiscono le proteine: leggono l’mRNA a gruppi di tre lettere (codoni); per ogni codone arriva un tRNA con l’amminoacido corrispondente.","mRNA → codoni → tRNA → amminoacidi → proteina.","Ribosomi liberi: proteine per la cellula stessa. Ribosomi sul reticolo rugoso: proteine per secrezione o membrane."],
u:["Il ribosoma è una piccola fabbrica: l’mRNA è il progetto, il tRNA porta i mattoni (amminoacidi), il ribosoma li assembla.","Molti antibiotici bloccano i ribosomi 70S dei batteri; i nostri ribosomi 80S sono diversi e vengono colpiti molto meno."]},
{id:"golgi",n:"Apparato di Golgi",e:"📦",
svg:S([0,1,2,3,4].map(function(i){return '<path d="M60 '+(60+i*20)+'Q150 '+(38+i*20)+' 240 '+(60+i*20)+'" fill="none" stroke="#D85A30" stroke-width="10" stroke-linecap="round"/>'}).join("")+[0,1,2].map(function(i){return '<circle cx="'+(30+i*8)+'" cy="'+(50+i*22)+'" r="6" fill="#F0997B"/>'}).join("")+[0,1,2].map(function(i){return '<circle cx="'+(262+i*6)+'" cy="'+(50+i*28)+'" r="8" fill="#F0997B"/>'}).join("")+L(10,28,"Faccia cis (ingresso)")+L(290,28,"Faccia trans (uscita)","end")+L(150,170,"Cisterne impilate","middle")+L(150,188,"Regione mediale: modificazioni chimiche","middle")+'<path d="M20 36v10M280 36v8" stroke="var(--m)"/>'),
come:["Cisterne: sacche di membrana appiattite e impilate; nelle cellule animali in genere 4-8 per pila, ma possono essere di più.","Faccia cis: lato di ingresso, verso nucleo e reticolo endoplasmatico; riceve le vescicole di trasporto.","Regione mediale: zona intermedia dove avviene gran parte delle modificazioni chimiche.","Faccia trans: lato di uscita, verso la membrana plasmatica; da qui partono le molecole smistate."],
f:["Modificazione chimica di proteine e lipidi; la più importante è la glicosilazione (aggiunta di zuccheri: nascono le glicoproteine).","Smistamento e impacchettamento: ogni molecola riceve un «codice di avviamento postale» chimico ed è racchiusa in vescicole.","Secrezione ed esocitosi: ormoni ed enzimi sono rilasciati fuori dalla cellula.","Formazione dei lisosomi: si staccano vescicole piene di enzimi digestivi."],
u:["È il «centro di smistamento e spedizione» della cellula.","Fu descritto nel 1898 dal medico italiano Camillo Golgi, da cui prende il nome.","Fa parte del sistema delle endomembrane."]},
{id:"lisosomi",n:"Lisosomi",e:"♻️",
svg:S('<circle cx="120" cy="100" r="70" fill="#E24B4A33" stroke="#A32D2D" stroke-width="5"/>'+[[90,80],[130,70],[150,110],[100,125],[125,95],[80,110],[145,85]].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="#E24B4A"/>'}).join("")+'<rect x="46" y="92" width="14" height="16" rx="3" fill="#EF9F27"/><rect x="180" y="92" width="14" height="16" rx="3" fill="#EF9F27"/>'+L(215,60,"Membrana")+L(215,76,"(una sola)")+L(215,102,"Pompa H⁺")+L(215,150,"Enzimi idrolitici")+L(120,100,"pH 4,5-5","middle")+'<path d="M212 56l-18 10M212 98l-12 2M212 146l-60-30" stroke="var(--m)" fill="none"/>'),
come:["Vescicola sferica delimitata da una sola membrana, che trattiene gli enzimi e contiene proteine di trasporto.","Contiene circa 50-60 tipi di enzimi idrolitici (idrolasi acide) che demoliscono proteine, acidi nucleici, carboidrati e lipidi.","Pompe protoniche spingono ioni H⁺ all’interno e mantengono l’interno acido (pH 4,5-5,0)."],
f:["Autofagia: demolisce componenti vecchi o danneggiati della cellula per riciclarli.","Eterofagia: digerisce sostanze, virus, batteri o corpi estranei che arrivano dall’esterno.","Rilascio dei nutrienti: amminoacidi e zuccheri semplici passano nel citoplasma e vengono riutilizzati."],
u:["È il centro di riciclaggio e il «sistema digerente» della cellula: un organulo, non una cellula.","Sicurezza: se pochi enzimi uscissero nel citoplasma (pH circa 7,2) sarebbero poco attivi e il danno sarebbe limitato.","Sono presenti nelle cellule eucariote, soprattutto animali."]},
{id:"mitocondri",n:"Mitocondri",e:"🔋",
svg:S('<ellipse cx="150" cy="95" rx="120" ry="62" fill="#EF9F2733" stroke="#BA7517" stroke-width="5"/><path d="M60 95q0-45 25-48 0 40 0 48M60 95q0 45 25 48M100 150q-8-35 0-50M100 40q-8 35 0 55M140 148q-8-35 0-55M140 42q-8 35 0 53M180 150q-8-35 0-55M180 40q-8 35 0 55M220 140q-8-30 0-45M220 50q-8 30 0 45" fill="none" stroke="#BA7517" stroke-width="3"/><circle cx="120" cy="95" r="5" fill="#534AB7"/><circle cx="205" cy="100" r="5" fill="#534AB7"/>'+L(150,20,"Membrana esterna","middle")+L(150,190,"Creste (membrana interna ripiegata) · Matrice con DNA mitocondriale","middle")+L(150,100,"Matrice","middle")),
come:["Membrana esterna: circonda il mitocondrio e lascia passare alcune piccole molecole.","Spazio intermembrana: qui si accumulano ioni H⁺, importanti per produrre ATP.","Membrana interna: ripiegata a formare le creste, che aumentano la superficie per la produzione di energia.","Matrice: parte interna con enzimi, ribosomi e DNA mitocondriale."],
f:["Producono ATP con la fosforilazione ossidativa: sono le «centrali energetiche» della cellula.","Ricavano energia dagli acidi grassi, partecipano alla produzione di alcuni ormoni steroidei, accumulano calcio (Ca²⁺) e controllano la morte cellulare programmata (apoptosi)."],
u:["Il nome viene dal greco: mítos («filo») e chóndros («granello»).","Le cellule che consumano più energia, come quelle dei muscoli, hanno più mitocondri e più creste.","Hanno un DNA proprio, circolare come quello dei batteri, con 37 geni nell’uomo. Ma la maggior parte delle proteine mitocondriali è prodotta dal DNA del nucleo.","Nell’uomo il DNA mitocondriale è trasmesso quasi sempre dalla madre: serve a studiare la discendenza materna e la storia delle popolazioni.","Doppia membrana, ribosomi propri e DNA circolare sostengono la teoria endosimbiotica: deriverebbero da batteri inglobati."]},
{id:"cloroplasto",n:"Cloroplasto",e:"🌿",
svg:S('<ellipse cx="140" cy="100" rx="125" ry="75" fill="#639F2233" stroke="#3B6D11" stroke-width="6"/><ellipse cx="140" cy="100" rx="116" ry="66" fill="none" stroke="#639F22" stroke-width="2"/>'+[[70,85],[120,70],[170,90],[100,125],[160,130]].map(function(p){return '<g>'+[0,1,2,3].map(function(i){return '<rect x="'+p[0]+'" y="'+(p[1]-i*7)+'" width="34" height="6" rx="3" fill="#3B6D11"/>'}).join("")+'</g>'}).join("")+'<path d="M104 90h16M154 95h18M135 128h25" stroke="#639F22" stroke-width="3"/>'+L(262,56,"Grano")+L(262,110,"Stroma")+L(262,150,"Tilacoide")+L(150,194,"Doppia membrana · DNA circolare · ribosomi","middle")+'<path d="M258 54l-100 22M258 108l-30 4M258 148l-80-18" stroke="var(--m)" fill="none"/>'),
come:["Doppia membrana: una esterna e una interna, separate dallo spazio intermembrana.","Stroma: liquido denso con enzimi, ribosomi e il DNA circolare del cloroplasto.","Tilacoidi: sacchetti piatti di membrana con la clorofilla, il pigmento verde che cattura la luce.","Grana: pile di tilacoidi sovrapposti (singolare: granum). Collegate dalle lamelle stromatiche."],
f:["Fotosintesi: 6 CO₂ + 6 H₂O + energia luminosa → C₆H₁₂O₆ (glucosio) + 6 O₂.","Fase luminosa (nei tilacoidi): la clorofilla cattura la luce e la trasforma in energia chimica (ATP e NADPH). Qui si libera l’ossigeno.","Fase di sintesi degli zuccheri (nello stroma, ciclo di Calvin): ATP e NADPH costruiscono il glucosio dalla CO₂."],
u:["È un tipo di plastidio, presente nelle cellule vegetali e nelle alghe.","L’ATP è la «moneta energetica» della cellula; il NADPH è un coenzima che trasporta elettroni ed energia.","Teoria endosimbiotica: i cloroplasti deriverebbero da cianobatteri inglobati e non digeriti da un eucariote eterotrofo.","Proposta da Merezhkovski (1905), ripresa da Ris (1962), riproposta da Lynn Margulis (1967) e resa popolare dai suoi lavori del 1981. Prove: DNA circolare e ribosomi simili a quelli dei batteri."]},
{id:"vacuolo",n:"Vacuolo",e:"💧",
svg:S('<rect x="10" y="10" width="280" height="180" rx="18" fill="#639F2222" stroke="#3B6D11" stroke-width="5"/><rect x="62" y="36" width="176" height="128" rx="40" fill="#85B7EB88" stroke="#185FA5" stroke-width="4"/>'+L(150,95,"Vacuolo centrale","middle")+L(150,112,"succo vacuolare","middle")+L(150,28,"Parete cellulare","middle")+L(150,182,"Tonoplasto (membrana del vacuolo)","middle")+'<circle cx="35" cy="100" r="8" fill="#EF9F27"/><circle cx="262" cy="70" r="6" fill="#EF9F27"/>'+L(35,125,"citoplasma","middle")),
come:["Organulo delimitato da una membrana, nel citoplasma, che contiene succo vacuolare: acqua, sali, zuccheri, pigmenti e altre sostanze.","Il vacuolo centrale è delimitato dal tonoplasto, che si forma dalla fusione di piccole vescicole ingrandite.","Cellule animali: vacuoli piccoli e poco numerosi. Cellule vegetali adulte: un grande vacuolo centrale, fino al 90% del volume."],
f:["Riserva: acqua, zuccheri (come il saccarosio), pigmenti e proteine di riserva (per esempio nei semi dei cereali).","Turgore: l’acqua spinge sulla parete cellulare e mantiene rigide le parti verdi. Senza acqua le piante appassiscono.","Digestione: gli enzimi idrolitici demoliscono molecole danneggiate o tossiche, come i lisosomi animali.","Scorie: immagazzina sostanze di scarto o dannose, separate dal resto della cellula."],
u:["Anche molti unicellulari hanno vacuoli: il vacuolo contrattile espelle l’acqua in eccesso.","I vacuoli influenzano resa e valore nutritivo delle piante, perché accumulano e trasportano nutrienti."]}
];
var Q=[
["Quale organulo è il «centro di smistamento e spedizione»?","Apparato di Golgi",["Lisosomi","Mitocondri","Ribosomi"]],
["Chi isolò per primo il DNA, nel 1869?","Friedrich Miescher",["Watson e Crick","Camillo Golgi","Lynn Margulis"]],
["Quanti cromosomi ha la specie umana?","46",["23","44","48"]],
["Dove avviene la fase luminosa della fotosintesi?","Nei tilacoidi",["Nello stroma","Nei mitocondri","Nel nucleolo"]],
["Quale pH hanno i lisosomi al loro interno?","Acido (4,5-5,0)",["Neutro (7,2)","Basico (9)","Variabile da 1 a 14"]],
["Quanti geni ha il DNA mitocondriale umano?","37",["46","13","100"]],
["Il nucleolo ha una membrana?","No, non è delimitato da membrana",["Sì, doppia","Sì, singola","Solo durante la mitosi"]],
["Cosa significa 80S per i ribosomi eucarioti?","Velocità di sedimentazione in centrifuga",["80 subunità","Peso in grammi","80 proteine"]],
["Quale struttura mantiene turgide le parti verdi della pianta?","Vacuolo centrale",["Lisosoma","Golgi","Nucleolo"]],
["Come si chiama la membrana del vacuolo?","Tonoplasto",["Tilacoide","Cresta","Lamina nucleare"]],
